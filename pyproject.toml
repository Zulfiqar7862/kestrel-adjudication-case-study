[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel-sentinel"
version = "0.5.0"
description = "Kestrel Sentinel: deterministic, as-of excursion adjudication with hash-chained evidence and human sign-off."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Zulfiqar Ali Ahmed" }]
dependencies = ["openpyxl>=3.1"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "pydantic>=2.5", "uvicorn>=0.27"]
dev = ["fastapi>=0.110", "pydantic>=2.5", "uvicorn>=0.27", "httpx>=0.27", "pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
kestrel = "kestrel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kestrel.api" = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "UP007", "UP045", "B008", "B904", "UP006", "UP035"]
