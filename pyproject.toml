[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kestrel-sentinel"
version = "0.2.0"
description = "As-of adjudication and evidence platform for Kestrel cold-chain excursion handling"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Zulfiqar Ali Ahmed" }]
dependencies = [
  "openpyxl>=3.1.0",
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
kestrel = "kestrel_sentinel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "prototype/tests"]
pythonpath = ["src", "prototype/src"]

[tool.ruff]
line-length = 100
target-version = "py311"
