name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: make install
      - name: Lint
        run: make lint
      - name: Test
        run: make test
      - name: Smoke-test the CLI
        run: |
          kestrel run-all --no-persist
          kestrel adjudicate --event EXC-107133

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t kestrel-sentinel .
      - name: Start container and check the API
        run: |
          docker run -d --name kestrel -p 8080:8080 kestrel-sentinel
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          curl -fsS http://127.0.0.1:8080/ui | grep -qi "kestrel"
          curl -fsS -X POST http://127.0.0.1:8080/adjudicate \
            -H 'Content-Type: application/json' -d '{"event_id":"EXC-107133"}'
      - name: Container logs
        if: always()
        run: docker logs kestrel || true
